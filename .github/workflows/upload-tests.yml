name: Upload Tests

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Upload tool to test"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cli
          - builder
      socs:
        description: "Comma-separated SoCs to test (leave empty for all CORE_SOCS)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - master
      - release/*
  pull_request:
    paths:
      - "platform.txt"
      - "programmers.txt"
      - "boards.txt"
      - "tools/flasher.py"
      - "package/package_esp32_index.template.json"
      - ".github/scripts/arduino_headless.sh"
      - ".github/scripts/build_upload_matrix.py"
      - ".github/scripts/find_boards.sh"
      - ".github/scripts/mock_upload_lib.sh"
      - ".github/scripts/test-mock-upload.sh"
      - ".github/scripts/install-arduino-builder.sh"
      - ".github/scripts/install-arduino-cli.sh"
      - ".github/scripts/install-arduino-core-esp32.sh"
      - ".github/scripts/sketch_utils.sh"
      - ".github/scripts/socs_config.sh"
      - ".github/workflows/upload-tests.yml"

concurrency:
  group: mock-upload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  should-run:
    name: Check if mock upload should run
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Get changed upload-related files
        if: github.event_name == 'pull_request'
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            boards:
              - boards.txt
            upload:
              - platform.txt
              - programmers.txt
              - tools/flasher.py
              - package/package_esp32_index.template.json
              - .github/scripts/arduino_headless.sh
              - .github/scripts/build_upload_matrix.py
              - .github/scripts/find_boards.sh
              - .github/scripts/mock_upload_lib.sh
              - .github/scripts/test-mock-upload.sh
              - .github/scripts/install-arduino-builder.sh
              - .github/scripts/install-arduino-cli.sh
              - .github/scripts/install-arduino-core-esp32.sh
              - .github/scripts/sketch_utils.sh
              - .github/scripts/socs_config.sh
              - .github/workflows/upload-tests.yml

      - name: Find changed official boards
        if: github.event_name == 'pull_request' && steps.changed.outputs.boards_any_changed == 'true'
        run: bash .github/scripts/find_boards.sh official ${{ github.repository }} ${{ github.base_ref }} --output-format=matrix

      - name: Decide whether to run mock upload and build matrix
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_CHANGED: ${{ steps.changed.outputs.upload_any_changed }}
          INPUT_TOOL: ${{ inputs.tool }}
          INPUT_SOCS: ${{ inputs.socs }}
        run: python3 .github/scripts/build_upload_matrix.py

  mock-upload:
    name: Mock upload on ${{ matrix.label }}
    needs: should-run
    if: needs.should-run.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.should-run.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pin to 3.12 so cryptography uses prebuilt wheels on x86_64 macOS instead of building Rust from source.
          python-version: "3.12"

      - name: Install python dependencies
        shell: bash
        run: |
          extra_pkgs=()
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ runner.arch }}" = "X64" ]; then
            # cryptography >=47 dropped macOS x86_64/universal2 wheels; <47 installs a prebuilt wheel in <1s instead of a 4m Rust build.
            extra_pkgs+=("cryptography<47")
          fi
          pip install pyserial "${extra_pkgs[@]}" esp32-mock-bootloader

      - name: Ensure local hostname resolves without mDNS stall (macOS JVM)
        if: runner.os == 'macOS' && matrix.tool != 'cli'
        run: |
          host_full="$(hostname)"
          host_short="$(hostname -s)"
          if ! grep -qF "$host_full" /etc/hosts; then
            echo "127.0.0.1 $host_full $host_short ${host_short}.local" | sudo tee -a /etc/hosts >/dev/null
            echo "::1 $host_full $host_short ${host_short}.local" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: Install xvfb (Linux builder upload)
        if: runner.os == 'Linux' && matrix.tool != 'cli'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Get libs cache
        id: libs-cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/package_esp32_index.template.json', 'tools/get.py') }}
          path: |
            ./tools/esp32-arduino-libs
            ./tools/esptool
            ./tools/mk*
            ./tools/openocd-esp32
            ./tools/riscv32-*
            ./tools/xtensa-*

      - name: Skip tool verification on libs cache hit
        if: runner.os == 'Linux' && steps.libs-cache.outputs.cache-hit == 'true'
        run: echo "ESP32_LIBS_CACHE_HIT=1" >> "$GITHUB_ENV"

      - name: Run mock upload tests
        shell: bash
        run: bash ./.github/scripts/test-mock-upload.sh "${{ matrix.tool }}" "${{ matrix.socs }}"
