name: Upload Tests

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Upload tool to test"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cli
          - builder
      socs:
        description: "Comma-separated SoCs to test (leave empty for all CORE_SOCS)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - master
      - release/*
  pull_request:
    paths:
      - "platform.txt"
      - "programmers.txt"
      - "boards.txt"
      - "tools/flasher.py"
      - "package/package_esp32_index.template.json"
      - ".github/scripts/arduino_headless.sh"
      - ".github/scripts/find_boards.sh"
      - ".github/scripts/mock_upload_lib.sh"
      - ".github/scripts/test-mock-upload.sh"
      - ".github/scripts/install-arduino-builder.sh"
      - ".github/scripts/install-arduino-cli.sh"
      - ".github/scripts/install-arduino-core-esp32.sh"
      - ".github/scripts/sketch_utils.sh"
      - ".github/scripts/socs_config.sh"
      - ".github/workflows/upload-tests.yml"

concurrency:
  group: mock-upload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  should-run:
    name: Check if mock upload should run
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Get changed upload-related files
        if: github.event_name == 'pull_request'
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            boards:
              - boards.txt
            upload:
              - platform.txt
              - programmers.txt
              - tools/flasher.py
              - package/package_esp32_index.template.json
              - .github/scripts/arduino_headless.sh
              - .github/scripts/find_boards.sh
              - .github/scripts/mock_upload_lib.sh
              - .github/scripts/test-mock-upload.sh
              - .github/scripts/install-arduino-builder.sh
              - .github/scripts/install-arduino-cli.sh
              - .github/scripts/install-arduino-core-esp32.sh
              - .github/scripts/sketch_utils.sh
              - .github/scripts/socs_config.sh
              - .github/workflows/upload-tests.yml

      - name: Find changed official boards
        if: github.event_name == 'pull_request' && steps.changed.outputs.boards_any_changed == 'true'
        run: bash .github/scripts/find_boards.sh official ${{ github.repository }} ${{ github.base_ref }} --output-format=matrix

      - name: Decide whether to run mock upload and build matrix
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_CHANGED: ${{ steps.changed.outputs.upload_any_changed }}
          INPUT_TOOL: ${{ inputs.tool }}
          INPUT_SOCS: ${{ inputs.socs }}
        run: |
          source ./.github/scripts/socs_config.sh
          export CORE_SOCS_CSV
          CORE_SOCS_CSV="$(IFS=,; echo "${CORE_SOCS[*]}")"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = os.environ.get("EVENT_NAME", "")
          upload_changed = os.environ.get("UPLOAD_CHANGED", "") == "true"
          fqbns_raw = os.environ.get("FQBNS", "").strip()
          input_tool = (os.environ.get("INPUT_TOOL") or "all").strip()
          input_socs = (os.environ.get("INPUT_SOCS") or "").strip()
          core_socs = [s for s in os.environ["CORE_SOCS_CSV"].split(",") if s]

          target_socs: list[str] = []
          if event == "workflow_dispatch" and input_socs:
              target_socs = [s.strip() for s in input_socs.replace(" ", ",").split(",") if s.strip()]
              unknown = [s for s in target_socs if s not in core_socs]
              if unknown:
                  raise SystemExit(f"Unknown SoC(s) in inputs.socs: {unknown} (valid CORE_SOCS: {core_socs})")
              reason = f"workflow_dispatch custom SoCs: {target_socs}"
          elif event != "pull_request":
              target_socs = core_socs
              reason = f"Non-PR ({event}); testing all {len(target_socs)} CORE_SOCS"
          elif upload_changed:
              target_socs = core_socs
              reason = f"Upload-related path changed; testing all {len(target_socs)} CORE_SOCS"
          elif fqbns_raw:
              parsed = json.loads(fqbns_raw)
              changed_socs = {item.split(":")[2] for item in parsed.get("fqbn", []) if item.count(":") >= 2}
              target_socs = [s for s in core_socs if s in changed_socs]
              reason = f"boards.txt-only PR; testing changed CORE_SOCS: {target_socs}"

          gh_out = Path(os.environ["GITHUB_OUTPUT"])
          if not target_socs:
              print("No official CORE_SOCS boards or upload-related paths changed; skipping mock upload")
              with gh_out.open("a", encoding="utf-8") as fh:
                  fh.write("should_run=false\n")
                  fh.write('matrix={"include":[]}\n')
              raise SystemExit(0)

          print(reason)

          def split_shards(items: list[str], max_shards: int) -> list[list[str]]:
              n = min(len(items), max_shards)
              base, extra = divmod(len(items), n)
              out: list[list[str]] = []
              idx = 0
              # Put smaller chunks first so heavier early SoCs (esp32s31/esp32) run in 2-SoC shards.
              for i in range(n):
                  size = base + (1 if i >= (n - extra) else 0)
                  out.append(items[idx : idx + size])
                  idx += size
              return out

          def add_shards(include: list[dict[str, str]], os_name: str, tool: str, max_shards: int) -> None:
              chunks = split_shards(target_socs, max_shards)
              total = len(chunks)
              for idx, chunk in enumerate(chunks, 1):
                  suffix = f" [{idx}/{total}]" if total > 1 else ""
                  include.append({
                      "os": os_name,
                      "tool": tool,
                      "socs": ",".join(chunk),
                      "label": f"{os_name} ({tool}{suffix})",
                  })

          # Keep concurrent macOS runners <= 4 (under GitHub's 5-runner macOS cap) and use
          # macos-26-intel (required for Arduino IDE v1; also avoids macos-latest arm64 queue starvation):
          include: list[dict[str, str]] = []
          if input_tool == "cli":
              add_shards(include, "ubuntu-latest", "cli", 1)
              add_shards(include, "windows-latest", "cli", 2)
              add_shards(include, "macos-26-intel", "cli", 2)
          elif input_tool == "builder":
              add_shards(include, "ubuntu-latest", "builder", 2)
              add_shards(include, "windows-latest", "builder", 3)
              add_shards(include, "macos-26-intel", "builder", 4)
          else:
              add_shards(include, "ubuntu-latest", "all", 2)
              add_shards(include, "windows-latest", "all", 3)
              add_shards(include, "macos-26-intel", "all", 4)

          matrix_json = json.dumps({"include": include}, separators=(",", ":"))
          print(f"Generated {len(include)} matrix jobs: {matrix_json}")
          with gh_out.open("a", encoding="utf-8") as fh:
              fh.write("should_run=true\n")
              fh.write(f"matrix={matrix_json}\n")
          PY

  mock-upload:
    name: Mock upload on ${{ matrix.label }}
    needs: should-run
    if: needs.should-run.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.should-run.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pin to 3.12 so cryptography uses prebuilt wheels on x86_64 macOS instead of building Rust from source.
          python-version: "3.12"

      - name: Install python dependencies
        shell: bash
        run: |
          extra_pkgs=()
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ runner.arch }}" = "X64" ]; then
            # cryptography >=47 dropped macOS x86_64/universal2 wheels; <47 installs a prebuilt wheel in <1s instead of a 4m Rust build.
            extra_pkgs+=("cryptography<47")
          fi
          pip install pyserial "${extra_pkgs[@]}" esp32-mock-bootloader

      - name: Ensure local hostname resolves without mDNS stall (macOS JVM)
        if: runner.os == 'macOS' && matrix.tool != 'cli'
        run: |
          host_full="$(hostname)"
          host_short="$(hostname -s)"
          if ! grep -qF "$host_full" /etc/hosts; then
            echo "127.0.0.1 $host_full $host_short ${host_short}.local" | sudo tee -a /etc/hosts >/dev/null
            echo "::1 $host_full $host_short ${host_short}.local" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: Install xvfb (Linux builder upload)
        if: runner.os == 'Linux' && matrix.tool != 'cli'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Get libs cache
        id: libs-cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/package_esp32_index.template.json', 'tools/get.py') }}
          path: |
            ./tools/esp32-arduino-libs
            ./tools/esptool
            ./tools/mk*
            ./tools/openocd-esp32
            ./tools/riscv32-*
            ./tools/xtensa-*

      - name: Skip tool verification on libs cache hit
        if: runner.os == 'Linux' && steps.libs-cache.outputs.cache-hit == 'true'
        run: echo "ESP32_LIBS_CACHE_HIT=1" >> "$GITHUB_ENV"

      - name: Run mock upload tests
        shell: bash
        run: bash ./.github/scripts/test-mock-upload.sh "${{ matrix.tool }}" "${{ matrix.socs }}"
