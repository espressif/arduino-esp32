name: Build tests

on:
  workflow_call:
    inputs:
      type:
        type: string
        description: "Type of tests to build"
        required: true
      chip:
        type: string
        description: "Chip to build tests for"
        required: true

permissions:
  contents: read
  # The cross-run binary hand-off lists workflow runs and their artifacts.
  actions: read

jobs:
  build-tests:
    name: Build ${{ inputs.type }} tests for ${{ inputs.chip }}
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      # Do not set CCACHE_BASEDIR. Ninja's WORKING_DIRECTORY is
      # ~/.arduino/tests/<chip>/.../build.tmp, outside the checkout.
      CCACHE_NOHASHDIR: 1
      CCACHE_DEPEND: 1
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
    steps:
      # Reuse the binaries this job already uploaded for the same PR commit
      # instead of keeping a per-PR copy in the Actions cache. The cache shares
      # its 10 GB quota with the compilation ccache, whose loss costs 25-40 min
      # per run, while an artifact costs nothing there and lives for 30 days
      # instead of 24 h. Label events (e.g. Status: Pending Merge) re-run this
      # workflow at the same commit, so the hand-off keeps those runs rebuild-free.
      - name: Find binaries from a previous run of this commit
        id: find-binaries
        if: github.event.pull_request.number != null
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN: ${{ github.run_id }}
          ARTIFACT: test-bin-${{ inputs.chip }}-${{ inputs.type }}
          # Must match retention-days on the artifact upload below: runs older
          # than that cannot have a live artifact, so stop scanning.
          ARTIFACT_RETENTION_DAYS: "30"
        run: |
          set -euo pipefail
          cutoff=$(python3 -c "import datetime as d; print((d.datetime.now(d.timezone.utc) - d.timedelta(days=int('$ARTIFACT_RETENTION_DAYS'))).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          checked=0
          # Newest first: the API returns runs by created_at descending.
          while IFS=$'\t' read -r run created; do
            [ -n "$run" ] || continue
            if [[ "$created" < "$cutoff" ]]; then
              echo "Stopping: run $run predates the ${ARTIFACT_RETENTION_DAYS}-day artifact retention"
              break
            fi
            checked=$((checked + 1))
            if [ "$checked" -gt 10 ]; then
              echo "Stopping after 10 candidate runs without a live artifact"
              break
            fi
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name==\"$ARTIFACT\" and .expired==false) | .id")
            if [ -n "$artifact" ]; then
              echo "Found $ARTIFACT in run $run"
              echo "run_id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=50" \
            --jq ".workflow_runs[] | select(.path==\".github/workflows/tests.yml\") | select(.id != ($CURRENT_RUN|tonumber)) | select(.status==\"completed\") | [(.id|tostring), .created_at] | @tsv")
          echo "No previous $ARTIFACT artifact for $HEAD_SHA"

      - name: Download binaries from the previous run
        id: download-binaries
        if: steps.find-binaries.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.find-binaries.outputs.run_id }}
          name: test-bin-${{ inputs.chip }}-${{ inputs.type }}
          path: |
            ~/.arduino/tests/${{ inputs.chip }}

      - name: Evaluate if tests should be built
        id: check-build
        run: |
          enabled=true
          if [[ "${{ steps.download-binaries.outcome }}" == "success" ]]; then
            echo "Already built, skipping"
            enabled=false
          fi

          echo "enabled=$enabled" >> $GITHUB_OUTPUT

      - name: Checkout user repository
        if: ${{ steps.check-build.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get libs cache
        id: libs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.check-build.outputs.enabled == 'true' }}
        with:
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/package_esp32_index.template.json', 'tools/get.py') }}
          path: |
            ./tools/esp32-arduino-libs
            ./tools/esptool
            ./tools/mk*
            ./tools/openocd-esp32
            ./tools/riscv32-*
            ./tools/xtensa-*

      - name: Skip tool verification on libs cache hit
        if: ${{ steps.check-build.outputs.enabled == 'true' && steps.libs-cache.outputs.cache-hit == 'true' }}
        run: echo "ESP32_LIBS_CACHE_HIT=1" >> "$GITHUB_ENV"

      - name: Install ccache
        if: ${{ steps.check-build.outputs.enabled == 'true' }}
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ccache
          version: 1

      # Tests-only store. Compilation Tests hashes do not match
      # tests argv (-I sketch path, per-test build_opt.h).
      - name: Restore ccache
        if: ${{ steps.check-build.outputs.enabled == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-tests-linux-${{ hashFiles('platform.txt', 'package.json', 'package/package_esp32_index.template.json', 'tools/get.py') }}-${{ github.sha }}
          restore-keys: |
            ccache-tests-linux-${{ hashFiles('platform.txt', 'package.json', 'package/package_esp32_index.template.json', 'tools/get.py') }}-

      - name: Zero ccache stats
        if: ${{ steps.check-build.outputs.enabled == 'true' }}
        run: ccache -z

      - name: Build sketches
        if: ${{ steps.check-build.outputs.enabled == 'true' }}
        run: |
          bash .github/scripts/tests_build.sh -c -type ${{ inputs.type }} -t ${{ inputs.chip }}

      - name: Show ccache stats
        if: always() && steps.check-build.outputs.enabled == 'true'
        run: ccache -sv

      # 1-day artifacts for merge in tests.yml. Runtime Tests has no
      # master push, so seed on schedule / workflow_dispatch only.
      - name: Upload ccache
        if: >
          success() &&
          steps.check-build.outputs.enabled == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccache_tests_${{ inputs.chip }}_${{ inputs.type }}
          path: ${{ github.workspace }}/.ccache
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
          overwrite: true

      - name: Upload ${{ inputs.chip }} ${{ inputs.type }} binaries as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-bin-${{ inputs.chip }}-${{ inputs.type }}
          overwrite: true
          # Kept for the cross-run hand-off (label events re-run the workflow at
          # the same PR commit). Long enough for a pending-merge PR to be
          # retried, short enough not to accumulate.
          retention-days: 30
          path: |
            ~/.arduino/tests/${{ inputs.chip }}/**/build*.tmp/*.bin
            ~/.arduino/tests/${{ inputs.chip }}/**/build*.tmp/*.elf
            ~/.arduino/tests/${{ inputs.chip }}/**/build*.tmp/*.json
            ~/.arduino/tests/${{ inputs.chip }}/**/build*.tmp/sdkconfig
            ~/.arduino/tests/${{ inputs.chip }}/**/build*.tmp/ci.yml
            ~/.arduino/tests/${{ inputs.chip }}/**/build*.tmp/flash_args
