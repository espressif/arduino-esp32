name: Boards Test

# The workflow will run on schedule and labeled pull requests
on:
  pull_request:
    paths:
      - "boards.txt"
      - "libraries/ESP32/examples/CI/CIBoardsTest/CIBoardsTest.ino"
      - ".github/workflows/boards.yml"
      - ".github/scripts/find_boards.sh"
      - ".github/scripts/validate_board.sh"

permissions:
  contents: read

env:
  # It's convenient to set variables for values used multiple times in the workflow
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  find-boards:
    runs-on: ubuntu-latest

    outputs:
      fqbns: ${{ env.FQBNS }}

    steps:
      # This step makes the contents of the repository available to the workflow
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get board name
        run: bash .github/scripts/find_boards.sh new ${{ github.repository }} ${{ github.base_ref }} --output-format=matrix

  test-boards:
    needs: find-boards
    runs-on: ubuntu-latest
    if: needs.find-boards.outputs.fqbns != ''

    env:
      REPOSITORY: |
        - source-path: '.'
          name: "espressif:esp32"

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.find-boards.outputs.fqbns) }}

    steps:
      # This step makes the contents of the repository available to the workflow
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate board definition
        run: |
          board_name=$(echo ${{ matrix.fqbn }} | awk -F':' '{print $NF}')
          ./.github/scripts/validate_board.sh "$board_name"

      - name: Get libs cache
        id: libs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/package_esp32_index.template.json', 'tools/get.py') }}
          path: |
            ./tools/esp32-arduino-libs
            ./tools/esptool
            ./tools/mk*
            ./tools/openocd-esp32
            ./tools/riscv32-*
            ./tools/xtensa-*

      - name: Skip tool verification on libs cache hit
        if: steps.libs-cache.outputs.cache-hit == 'true'
        run: echo "ESP32_LIBS_CACHE_HIT=1" >> "$GITHUB_ENV"

      - name: Compile sketch
        uses: P-R-O-C-H-Y/compile-sketches@016e3c2dae7a68d7f759d358f1486a301f7e4150 # main
        with:
          platforms: |
            ${{ env.REPOSITORY }}
          fqbn: ${{ matrix.fqbn }}
          use-json-file: false
          enable-deltas-report: false
          enable-warnings-report: false
          cli-compile-flags: |
            - --warnings="all"
          exit-on-fail: true
          sketch-paths: "- ./libraries/ESP32/examples/CI/CIBoardsTest/CIBoardsTest.ino"
          verbose: true
