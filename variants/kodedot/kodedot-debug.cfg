##
# @file kodedot-debug.cfg
# @brief OpenOCD settings for the Kode Dot, loaded after board/esp32p4-builtin.cfg.
#
# A sketch runs in place from kodeOS's apps region, an address OpenOCD's flash probe cannot
# describe ("Failed to get flash maps"): the memory map is off, GDB trusts the ELF, and every
# breakpoint is a hardware one (three triggers per core, shared with watchpoints).
#
# Start Debugging never uploads, and the bootloader only boots the sketch while a boot request
# stands, which Upload is what arms: with kodeOS on the screen the debugger's reset comes back to
# kodeOS and GDB would wait for setup() forever. So GDB's attach commands call kodedot_check before
# that reset, and the session stops with a message when the chip is not running the sketch being
# debugged.
#
# The board entry passes the sketch's .bin in a -c argument (cortex-debug's serverArgs):
#     set ::kodedot_bin {<build path>/<sketch>.bin}
# and GDB calls
#     eval "monitor kodedot_check 0x%x", &esp_app_desc

gdb memory_map disable
gdb breakpoint_override hard

# Attach by halting, never by resetting: the stock gdb-attach handler in target/esp_common.cfg
# resets the chip on some attaches, and the one reset has to be the attach commands', after
# kodedot_check has read what was running.
esp32p4.hp.cpu0 configure -event gdb-attach {
  if {[catch {halt 1000} msg opts]} {
    if {[esp32p4.hp.cpu0 curstate] != "halted"} { return -options $opts $msg }
  }
  esp32p4.hp.cpu0 riscv set_maskisr steponly
  esp32p4.hp.cpu1 riscv set_maskisr steponly
}

## @brief Resume the sketch if the debugger is leaving it halted.
proc kodedot_resume_if_halted {} {
  if {[esp32p4.hp.cpu0 curstate] == "halted"} { resume }
}

# Nothing resumes a halted hart when the debugger leaves, and OpenOCD's shutdown then disables the
# debug module with the hart halted, so both exits resume it explicitly.
# GDB's detach is delivered to the hart it last stopped on, which is cpu1 for a sketch breakpoint.
esp32p4.hp.cpu0 configure -event gdb-detach { kodedot_resume_if_halted }
esp32p4.hp.cpu1 configure -event gdb-detach { kodedot_resume_if_halted }
# The shutdown hook is wrapped in catch (the list is walked with eval, no error handling) and goes
# first, ahead of the entry that turns the debug module off; the detach callbacks run again after
# the shutdown commands, so the resume has to be safe to reach twice.
set ::pre_shutdown_commands [linsert $::pre_shutdown_commands 0 { catch { kodedot_resume_if_halted } }]

## @brief Offset of the app descriptor inside an application image.
set ::kodedot_desc_off 0x20
## @brief Size of the app descriptor, an esp_app_desc_t.
set ::kodedot_desc_len 256

##
# @brief Read the app descriptor of an application image file.
# @param bin Path of the image, a sketch's .bin.
# @return The descriptor as a list of 32-bit words.
proc kodedot_desc_in_file {bin} {
  set f [open $bin rb]
  seek $f $::kodedot_desc_off
  set data [read $f $::kodedot_desc_len]
  close $f
  if {[string length $data] != $::kodedot_desc_len} {
    error "Kode Dot: $bin is too short to be an application image"
  }
  # no "binary" command in OpenOCD's Jim Tcl: assemble little-endian words by hand
  set words {}
  for {set i 0} {$i < $::kodedot_desc_len} {incr i 4} {
    set w 0
    for {set j 3} {$j >= 0} {incr j -1} {
      set w [expr {($w << 8) | [scan [string index $data [expr {$i + $j}]] %c]}]
    }
    lappend words $w
  }
  if {[lindex $words 0] != 0xabcd5432} {
    error "Kode Dot: $bin does not carry an app descriptor at offset $::kodedot_desc_off"
  }
  return $words
}

##
# @brief Read the app descriptor of the image the chip is running, halting it for the read.
# @param addr Address of esp_app_desc in the sketch being debugged.
# @return The descriptor as a list of 32-bit words, or an empty list if it cannot be read.
proc kodedot_desc_on_chip {addr} {
  set words {}
  set was_running [expr {[esp32p4.hp.cpu0 curstate] == "running"}]
  if {$was_running} { catch { halt 1000 } }
  catch { set words [read_memory $addr 32 [expr {$::kodedot_desc_len / 4}]] }
  if {$was_running} { catch { resume } }
  return $words
}

##
# @brief Tell whether two app descriptors describe the same build.
# @param a One descriptor, as a list of 32-bit words.
# @param b The other descriptor.
# @return 1 if every word matches, else 0.
proc kodedot_same_build {a b} {
  if {[llength $a] != [llength $b]} { return 0 }
  foreach x $a y $b {
    if {[expr {$x & 0xFFFFFFFF}] != [expr {$y & 0xFFFFFFFF}]} { return 0 }
  }
  return 1
}

##
# @brief Stop the debug session unless the chip is running the sketch being debugged.
#
# Compares the app descriptor the chip is running with the one in ::kodedot_bin. The error ends
# GDB's attach commands before their reset, so the board keeps running what it was running.
#
# @param desc_addr Address of esp_app_desc in the sketch being debugged.
proc kodedot_check {desc_addr} {
  set running [kodedot_desc_on_chip $desc_addr]
  set built [kodedot_desc_in_file $::kodedot_bin]
  if {![kodedot_same_build $running $built]} {
    error "Kode Dot: the chip is not running this build of the sketch; press Upload, then Start Debugging again"
  }
}
